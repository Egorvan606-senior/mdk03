name: pk-16-18 CI (CAMPUS-110, v1.6.0)

on:
  push:
    branches: [ main ]
    paths: [ "pk-16-18/**", ".github/workflows/pk-16-18-ci.yml" ]
  pull_request:
    branches: [ main ]
    paths: [ "pk-16-18/**", ".github/workflows/pk-16-18-ci.yml" ]
  workflow_dispatch:

jobs:
  xunit-tests:
    name: xunit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pk-16-18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SmartCampus.Sport.sln

      - name: Build
        run: dotnet build SmartCampus.Sport.sln -c Release --no-restore

      - name: Unit tests (sanity-тест пропускается без SANITY_BASE_URL)
        run: dotnet test SmartCampus.Sport.sln -c Release --no-build --filter "Category!=Sanity" --logger "console;verbosity=normal"

  db-migrations:
    name: db-migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Expand -> Migrate -> Contract на PostgreSQL 16
        run: bash pk-16-18/db/test/run_migration_test.sh

  k8s-manifests:
    name: k8s-manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install kubernetes-validate
        run: pip install kubernetes-validate==1.37.0

      - name: Манифесты Deployment и отката по схеме Kubernetes 1.30 (strict)
        run: kubernetes-validate --strict -k 1.30.0 pk-16-18/deploy/k8s/*.yaml pk-16-18/deploy/k8s/rollback/*.yaml
